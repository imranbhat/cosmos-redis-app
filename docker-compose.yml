version: "3.8"

services:
  # Redis for local development (standalone mode)
  redis:
    image: redis:7.2-alpine
    container_name: redis-local
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Redis Commander UI (optional, for debugging)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - app-network
    profiles:
      - debug

volumes:
  redis-data:

networks:
  app-network:
    driver: bridge
