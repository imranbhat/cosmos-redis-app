# Application Configuration
spring:
  application:
    name: spring-boot-redis-app

  # Default Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      connect-timeout: 2000ms
      lettuce:
        pool:
          enabled: true
          max-active: 50 # Increased for high traffic (20M/day)
          max-idle: 25
          min-idle: 10
          max-wait: 500ms # Fail fast

  # Cache Configuration
  cache:
    type: redis
    redis:
      time-to-live: 300000 # Default 5 minutes
      cache-null-values: false
      use-key-prefix: true
      key-prefix: "app:v1:"

# L1 Cache (Caffeine) - Local, per-node
cache:
  l1:
    max-size: 10000 # Max entries per cache
    ttl:
      reference-data: 60 # 1 minute (shorter than L2)
      user-data: 30 # 30 seconds
      api-response: 10 # 10 seconds

  # L2 Cache (Redis) - Distributed
  ttl:
    reference-data: 3600 # 1 hour
    user-data: 300 # 5 minutes
    api-response: 30 # 30 seconds

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,caches,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

# Server Configuration
server:
  port: 8080

# Logging
logging:
  level:
    com.example.redis: INFO
    org.springframework.cache: DEBUG
    io.lettuce: INFO
